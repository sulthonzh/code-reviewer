name: "AI Code Reviewer"
description: "AI-powered code review using Z.AI with secret scanning, quality gates, and auto-merge"
author: "sulthonzh"

inputs:
  command:
    description: "Command to execute: secret-scan, detect-context, ai-review, quality-gate, auto-merge, auto-release, post-status"
    required: true
  model:
    description: "Z.AI model to use for review"
    required: false
    default: "glm-4.5"
  project-type:
    description: "Override project type detection (auto, nextjs, cli, python, go, zig)"
    required: false
    default: "auto"
  zai-api-key:
    description: "Z.AI API key"
    required: false
    default: ""
  zai-base-url:
    description: "Z.AI API base URL"
    required: false
    default: "https://api.z.ai/api/coding/paas/v4/"
  github-token:
    description: "GitHub token (GITHUB_TOKEN or PAT)"
    required: false
    default: ""
  reviewer-pat:
    description: "GitHub PAT for posting reviews as a specific user"
    required: false
    default: ""
  app-id:
    description: "GitHub App ID for auto-merge"
    required: false
    default: ""
  app-private-key:
    description: "GitHub App private key for auto-merge"
    required: false
    default: ""
  passed:
    description: "Whether the quality gate passed"
    required: false
    default: "true"

outputs:
  approved:
    description: "Whether the PR was approved by AI review"
    value: ${{ steps.review.outputs.approved }}
  model:
    description: "Model used for AI review"
    value: ${{ steps.review.outputs.model }}
  project_type:
    description: "Detected project type"
    value: ${{ steps.review.outputs.project_type }}
  found:
    description: "Whether secrets were found"
    value: ${{ steps.review.outputs.found }}
  count:
    description: "Number of secrets found"
    value: ${{ steps.review.outputs.count }}
  complexity:
    description: "Detected complexity level"
    value: ${{ steps.review.outputs.complexity }}
  passed:
    description: "Whether the quality gate passed"
    value: ${{ steps.review.outputs.passed }}

runs:
  using: "node20"
  main: "dist/index.js"
